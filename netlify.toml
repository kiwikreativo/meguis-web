[[redirects]]
  from = "/agente-aduanero-puerto-cortes/"
  to = "/agencia-aduanera-puerto-cortes/"
  status = 301
  force = true

[[redirects]]
  from = "/asesoria-legal-aduanera/"
  to = "/orientacion-aduanera/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
